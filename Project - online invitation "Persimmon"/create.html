<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создать приглашение 💌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html">💌 pinkvite</a>
  <a href="index.html#how">Как это работает</a><a href="index.html#feat">Возможности</a><a href="index.html#faq">Вопросы</a>
  
</div></nav>
<div class="wrap">
<section id="make" style="padding-top:30px">
    <h2>Собери своё приглашение</h2>
    <div class="builder">
      <div class="panel">
        <div class="steps" id="steps"></div>
        <div id="fields"></div>
        <div class="nav2">
          <button class="btn w" id="prev">← Назад</button>
          <button class="btn" id="next">Далее →</button>
        </div>
        <div class="out" id="out">
          <label style="font-weight:700">Твоя ссылка на приглашение</label>
          <input id="link" readonly>
          <button class="btn" id="copy">Скопировать ссылку</button>
          <p><small>Ссылка бесплатная и без срока действия. Чтобы она открывалась у других, этот сайт должен лежать в интернете.</small></p>
        </div>
      </div>
      <div style="flex:none;margin:0 auto">
        <div class="phone" id="prev-phone" data-prev="1"></div>
        <p style="text-align:center;color:var(--mu);font-size:13px;margin:8px 0" id="cap"></p><div class="tryb"><button class="btn w" id="tryI" style="display:none">Попробовать вступление</button></div>
      </div>
    </div>
  </section>
</div>
<script src="core.js"></script>
<script src="builder.js"></script>
</body>
</html>
